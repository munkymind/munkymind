name: Eval Suite

on:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run eval suite (fixture data)
        run: python -m pytest tests/test_eval.py -v --tb=short
        env:
          MM_EVAL_CI: "true"
