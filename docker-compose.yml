services:

  # One-shot: hands the data volume to the app user (uid 10001). Needed once when upgrading
  # from a release that ran as root; a no-op afterwards. It is the only service that starts
  # as root, and it keeps just the capabilities required to change file ownership.
  volume-init:
    build: .
    image: munkymind/api:latest
    user: "0:0"
    command: ["true"]
    volumes:
      - mm_data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  api:
    build: .
    image: munkymind/api:latest
    command: uvicorn mm.api.server:app --host 0.0.0.0 --port 8000
    ports:
      # Localhost only by default; set MM_BIND=0.0.0.0 to expose on your network (not recommended).
      - "${MM_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - mm_data:/data
      # Your notes, read-only — point the files connector at /notes
      - ${MM_NOTES_DIR:-./notes}:/notes:ro
    environment:
      - DATA_ROOT=/data
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - MM_LLM_PROVIDER=${MM_LLM_PROVIDER:-anthropic}
      - MM_EMBED_PROVIDER=${MM_EMBED_PROVIDER:-openai}
      - MM_VOICE
      # Re-index changed notes every N seconds (0 = off; then run `munkymind ingest` yourself)
      - MM_SYNC_INTERVAL=${MM_SYNC_INTERVAL:-300}
      # The host port, so links printed inside the container point at the right place
      - API_PORT=${API_PORT:-8000}
      # The user the MCP container serves, so setup can tell you if it doesn't match
      - MM_USER_ID=${MM_USER_ID:-default}
      # Ollama on your computer (localhost inside a container is the container itself)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the name work on Linux too
    depends_on:
      volume-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Check every 2s while starting, so `up` (and the MCP container) isn't held for 30s
      start_period: 60s
      start_interval: 2s

  mcp:
    build: .
    image: munkymind/api:latest
    command: python -m mm.mcp.server --transport http --port 8001
    ports:
      - "${MM_BIND:-127.0.0.1}:${MCP_PORT:-8001}:8001"
    volumes:
      - mm_data:/data
    environment:
      - DATA_ROOT=/data
      - USER_ID=${MM_USER_ID:-default}
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - MM_LLM_PROVIDER=${MM_LLM_PROVIDER:-anthropic}
      - MM_EMBED_PROVIDER=${MM_EMBED_PROVIDER:-openai}
      # Public HTTPS address for claude.ai / ChatGPT connectors (e.g. your tunnel URL).
      # Leave empty for Claude Desktop or local use.
      - MCP_BASE_URL=${MCP_BASE_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mm_data:
    driver: local
