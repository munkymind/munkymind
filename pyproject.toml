[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "munkymind"
version = "0.2.2"
description = "Your AI tools forget you every conversation. Munkymind remembers everything, across every tool, forever."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["personal-ai", "context-library", "mcp", "self-hosted", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "chromadb>=0.5.0",
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "bcrypt>=4.1.0",
    "pdfplumber>=0.11.0",
    "requests>=2.32.0",
    "mcp>=1.0.0",
    "base58>=2.1.1",
    "responses>=0.26.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
munkymind = "mm.cli.main:app"
monkey-mind = "mm.cli.main:app"  # old name, kept so existing installs and scripts keep working

[project.entry-points."munkymind.connectors"]
files = "mm.connectors.files:FilesConnector"
github = "mm.connectors.github:GitHubConnector"

[tool.setuptools.packages.find]
where = ["."]
include = ["mm*"]

[tool.setuptools.package-data]
mm = ["ui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
